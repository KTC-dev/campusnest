[build]
builder = "DOCKERFILE"

dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'if [ -f /app/backend/package.json ]; then cd /app/backend && npx prisma migrate deploy && node dist/server.js; elif [ -f /app/package.json ]; then npx prisma migrate deploy && node dist/server.js; else echo \"No backend package.json found\" && exit 1; fi'"
